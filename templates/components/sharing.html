{{define "sharing"}}
<dialog x-ref="share" @click="$event.target === $el && $el.close()" aria-labelledby="share-title"
        class="m-0 mt-auto w-full max-w-none rounded-t-3xl bg-white p-0 text-stone-800 shadow-2xl backdrop:bg-stone-900/50 sm:m-auto sm:max-w-md sm:rounded-3xl">
  <div class="p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))] sm:p-6">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-emerald-700">Zdieľať na čítanie</p>
        <h2 id="share-title" class="mt-0.5 text-lg font-bold text-stone-900" x-text="current ? current.title : ''"></h2>
      </div>
      <button type="button" @click="$refs.share.close()" aria-label="Zavrieť"
              class="-mr-2 -mt-1 rounded-full p-2 text-stone-400 hover:bg-stone-100 hover:text-stone-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500">
        {{template "close-icon"}}
      </button>
    </div>
    <p class="mt-2 text-sm text-stone-500">Ktokoľvek s týmto odkazom uvidí tento itinerár bez prihlásenia. Nemôže ho meniť a ostatné itineráre neuvidí.</p>
    <p x-show="sharing.busy" class="mt-4 text-sm text-stone-500">Pripravuje sa odkaz…</p>
    <div x-show="sharing.url" class="mt-4 flex gap-2">
      <label class="min-w-0 flex-1">
        <span class="sr-only">Odkaz na čítanie</span>
        <input type="text" readonly :value="sharing.url" @focus="$el.select()" @click="$el.select()"
               class="w-full rounded-lg border border-stone-200 bg-stone-50 px-3 py-2.5 text-sm text-stone-700">
      </label>
      <button type="button" @click="copyShare()" title="Kopírovať odkaz" aria-label="Kopírovať odkaz"
              class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg text-emerald-700 ring-1 ring-emerald-200 hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-500"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="M5 15V6a2 2 0 012-2h9"/></svg></button>
    </div>
    <button type="button" x-show="sharing.url && canNativeShare" @click="nativeShare()"
            class="mt-3 w-full rounded-lg bg-emerald-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-800">Poslať…</button>
    <button type="button" x-show="!sharing.url && !sharing.busy && sharing.revoked" @click="loadShareLink()"
            class="mt-4 w-full rounded-lg bg-emerald-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-800">Vytvoriť nový odkaz</button>
    <p role="status" aria-live="polite" class="mt-3 text-sm" :class="sharing.failed ? 'text-red-700' : 'text-emerald-700'" x-text="sharing.message"></p>
    <button type="button" x-show="sharing.url" @click="revokeShare()"
            class="mt-3 text-xs font-semibold text-stone-400 hover:text-red-600">Zrušiť odkaz (prestane fungovať aj u tých, ktorí ho už majú)</button>
  </div>
</dialog>
{{end}}
