{{define "day-route"}}
<nav class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-2 sm:mx-0 sm:px-0" role="tablist">
  <template x-for="(d, i) in current.days" :key="i">
    <button type="button" role="tab" :aria-selected="i === dayIndex" @click="dayIndex = i"
            class="shrink-0 rounded-xl px-4 py-2 text-sm font-semibold transition focus:outline-none focus:ring-2 focus:ring-emerald-500"
            :class="i === dayIndex ? 'bg-emerald-700 text-white shadow' : 'bg-white text-stone-600 ring-1 ring-stone-200 hover:bg-emerald-50 hover:text-emerald-800'">
      <span x-text="d.label"></span>
      <span class="ml-1 text-xs opacity-70" x-text="'(' + d.activities.length + ')'"></span>
    </button>
  </template>
</nav>
<div class="mt-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 sm:p-5" x-show="day">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 class="flex items-center gap-2 font-bold text-stone-900">
      <svg class="h-5 w-5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.4-2.7A1 1 0 013 16.4V5.6a1 1 0 011.4-.9L9 7m0 13l6-3m-6 3V7m6 10l4.6 2.3a1 1 0 001.4-.9V7.6a1 1 0 00-.6-.9L15 4m0 13V4m0 0L9 7"/></svg>
      <span x-text="'Trasa dňa · ' + (day ? day.label : '')"></span>
    </h2>
    <button type="button" x-show="dayRoute.stops.length" @click="openNav('Trasa dňa · ' + day.label, dayRoute.stops, routeStart)"
            class="inline-flex items-center gap-1.5 rounded-xl bg-amber-400 px-4 py-2 text-sm font-semibold text-emerald-950 shadow-sm hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      Otvoriť trasu v Mapách ↗
    </button>
  </div>
  <label class="mt-3 block">
    <span class="text-xs font-semibold uppercase tracking-wide text-stone-500">Štart (voliteľný)</span>
    <input type="text" :value="start" @input="start = $event.target.value; saveStart()" @change="routeStart = start.trim()" autocomplete="off"
           placeholder="napr. hotel, v ktorom ste ubytovaní"
           class="mt-1 w-full rounded-xl border border-stone-200 bg-stone-50 px-3 py-2 text-sm focus:border-emerald-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-200">
  </label>
  <p class="mt-1 text-xs text-stone-500" x-show="startMatch !== null"
     x-text="startMatch ? 'Na mape: ' + startMatch : 'Štart sa na mape nenašiel, vzdialenosť od neho sa nezobrazí. Skúste presnejší názov alebo adresu.'"></p>
  <p class="mt-1 text-xs text-stone-400" x-show="!start.trim()">Bez štartu začne trasa vo vašej aktuálnej polohe. Platí pre všetky dni tohto itinerára.</p>
  <ol class="mt-3 flex flex-wrap items-center gap-x-1.5 gap-y-2 text-sm" x-show="dayRoute.stops.length">
    <li x-show="routeStart" class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 py-1 pl-1 pr-3 ring-1 ring-amber-200">
      <span class="flex h-5 w-5 items-center justify-center rounded-full bg-amber-400 text-[11px] font-bold text-emerald-950">S</span>
      <span x-text="routeStart"></span>
    </li>
    <template x-for="(s, k) in dayRoute.stops" :key="k">
      <li class="inline-flex items-center gap-1.5">
        <span class="text-stone-300" x-show="k > 0 || routeStart" aria-hidden="true">→</span>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 py-1 pl-1 pr-3 ring-1 ring-emerald-200">
          <span class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-700 text-[11px] font-bold text-white" x-text="k + 1"></span>
          <span x-text="s"></span>
        </span>
      </li>
    </template>
  </ol>
  <p class="mt-2 text-sm text-stone-500" x-show="legTotal" x-text="'Spolu autom: ' + fmtLeg(legTotal)"></p>
  <p class="mt-3 text-sm text-stone-500" x-show="!dayRoute.stops.length">Tento deň nemá žiadne body na mape.</p>
  <button type="button" x-show="hasGuide && current.localGuide.gettingAround" @click="openGuide()"
          class="mt-3 inline-flex items-center gap-1.5 text-sm font-semibold text-emerald-700 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500">
    Ako sa tu pohybovať · rady od miestnych →
  </button>
</div>
{{end}}
