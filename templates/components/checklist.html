{{define "checklist"}}
<aside class="lg:sticky lg:top-6 lg:self-start" aria-label="Checklist">
  <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-stone-200">
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-bold text-stone-900">Checklist</h2>
      <span class="text-sm font-semibold text-emerald-700" x-text="progress.done + ' / ' + progress.total"></span>
    </div>
    <div class="mt-3 h-2 overflow-hidden rounded-full bg-stone-100">
      <div class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-amber-400 transition-all duration-300" :style="'width:' + progress.pct + '%'"></div>
    </div>
    <ul x-show="!editingChecklist" class="mt-4 space-y-1">
      <template x-for="(item, index) in current.checklist" :key="index">
        <li>
          <label class="flex cursor-pointer items-start gap-3 rounded-lg p-2 hover:bg-stone-50">
            <input type="checkbox" class="mt-0.5 h-5 w-5 shrink-0 rounded border-stone-300 accent-emerald-600"
                   :checked="checked.includes(item)" @change="toggle(item)">
            <span class="text-sm" :class="checked.includes(item) && 'text-stone-400 line-through'" x-text="item"></span>
          </label>
        </li>
      </template>
    </ul>
    <p x-show="!current.checklist.length" class="text-sm text-stone-500">Bez položiek.</p>
    <button type="button" x-show="canEdit && !editingChecklist" @click="beginChecklistEdit()" class="mt-4 rounded-lg px-3 py-2 text-sm font-semibold text-emerald-700 ring-1 ring-emerald-200">Upraviť zoznam</button>
    <button type="button" x-show="canEdit && !editingChecklist" @click="shareChecklist()" :disabled="sharingChecklist" class="mt-4 rounded-lg px-3 py-2 text-sm font-semibold text-emerald-700 ring-1 ring-emerald-200 disabled:opacity-50" x-text="sharingChecklist ? 'Pripravuje sa…' : 'Zdieľať zoznam'"></button>
    <div x-show="shareUrl" class="mt-3 space-y-2">
      <p class="text-xs text-stone-600">Každý s odkazom môže upravovať zoznam.</p>
      <label class="block text-xs text-stone-600">Odkaz na úpravu
        <input type="text" readonly :value="shareUrl" @focus="$el.select()" @click="$el.select()" class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm">
      </label>
    </div>
    <p role="status" aria-live="polite" class="mt-2 text-sm text-stone-600" x-text="shareMessage"></p>
    <form x-show="editingChecklist" @submit.prevent="saveChecklist()" class="mt-4 space-y-3">
      <fieldset :disabled="savingChecklist" class="space-y-3">
        <template x-for="(entry, index) in checklistDraft" :key="entry.id">
          <div class="flex items-start gap-2">
            <label class="min-w-0 flex-1">
              <span class="sr-only" x-text="'Položka ' + (index + 1)"></span>
              <textarea :value="entry.text" @input="changeChecklistItem(entry.id, $event.target.value)" required maxlength="500" rows="2" class="w-full rounded-lg border border-stone-300 p-2 text-sm focus:ring-2 focus:ring-emerald-500"></textarea>
            </label>
            <button type="button" @click="checklistDraft = checklistDraft.filter(e => e.id !== entry.id)" :aria-label="'Odstrániť položku ' + (index + 1)" class="rounded-lg py-2 text-xs text-red-700">Odstrániť</button>
          </div>
        </template>
        <button type="button" @click="addChecklistItem()" :disabled="checklistDraft.length >= 200" class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-700 ring-1 ring-emerald-200 disabled:opacity-50">Pridať položku</button>
        <div class="flex flex-wrap gap-2">
          <button type="submit" class="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white" x-text="savingChecklist ? 'Ukladá sa…' : 'Uložiť zmeny'"></button>
          <button type="button" @click="editingChecklist = false; checklistMessage = ''" class="rounded-lg px-3 py-2 text-sm text-stone-600">Zrušiť</button>
        </div>
      </fieldset>
    </form>
    <p role="status" aria-live="polite" class="mt-3 text-sm" :class="checklistFailed ? 'text-red-700' : 'text-emerald-700'" x-text="checklistMessage"></p>
    <button type="button" x-show="checked.length" @click="checked = []; save()"
            class="mt-3 text-xs font-semibold text-stone-400 hover:text-red-600">Zrušiť všetky označenia</button>
  </div>
</aside>
{{end}}
