{{define "header"}}
<header class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-emerald-600 text-white shadow-lg">
  <div class="mx-auto max-w-6xl px-4 pb-5 pt-3 sm:px-6 sm:pb-8 sm:pt-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-sm font-semibold uppercase tracking-wider text-emerald-100">
        <button type="button" x-show="!shared" @click="$refs.drawer.showModal()" aria-label="Menu: itineráre a akcie"
                class="-ml-2 rounded-xl p-2 text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-amber-300 sm:hidden">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <svg class="h-5 w-5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 20l6-16 4 10 3-5 5 11H3z"/></svg>
        Rodinné itineráre
      </div>
      <span x-show="shared" class="rounded-full bg-white/15 px-3 py-1 text-xs font-semibold text-emerald-50">Zdieľané · len na čítanie</span>
      <button type="button" x-show="signIn" @click="startSignIn()" title="Prihláste sa a môžete upravovať a zdieľať zoznam"
              class="rounded-xl border border-white/20 bg-white/10 px-3 py-2 text-sm font-semibold text-white hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-amber-300">Prihlásiť sa</button>
      <div x-show="!shared" class="hidden items-center gap-2 sm:flex">
        <label class="relative min-w-0 flex-1 sm:w-80 sm:flex-none" x-show="list.length">
          <span class="sr-only">Vybrať itinerár</span>
          <select x-model="selectedId" @change="select(selectedId)"
                  class="w-full appearance-none rounded-xl border border-white/20 bg-white/10 py-2.5 pl-4 pr-10 text-sm font-medium text-white backdrop-blur focus:outline-none focus:ring-2 focus:ring-amber-300">
            <template x-for="i in list" :key="i.id">
              <option class="text-stone-800" :value="i.id" x-text="i.title" :selected="i.id === selectedId"></option>
            </template>
          </select>
          <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-emerald-100" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5.3 7.3a1 1 0 011.4 0L10 10.6l3.3-3.3a1 1 0 111.4 1.4l-4 4a1 1 0 01-1.4 0l-4-4a1 1 0 010-1.4z"/></svg>
        </label>
        <button type="button" x-show="current" @click="openShare()" title="Zdieľať na čítanie bez prihlásenia"
                class="inline-flex shrink-0 items-center gap-1.5 rounded-xl border border-white/20 bg-white/10 px-3 py-2.5 text-sm font-semibold text-white backdrop-blur hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-amber-300">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path stroke-linecap="round" d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          Zdieľať
        </button>
        <button type="button" @click="openIO()" title="Import a export pre AI asistentov"
                class="inline-flex shrink-0 items-center gap-1.5 rounded-xl border border-white/20 bg-white/10 px-3 py-2.5 text-sm font-semibold text-white backdrop-blur hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-amber-300">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7 10l5-5 5 5M12 5v11M5 19h14"/></svg>
          Import / Export
        </button>
      </div>
    </div>
    <template x-if="current">
      <div class="mt-6 transition-opacity duration-200" :class="loading && 'opacity-50'">
        <h1 class="text-2xl font-bold leading-tight sm:text-4xl" x-text="current.title"></h1>
        <p class="mt-2 text-emerald-100 sm:text-lg" x-show="current.subtitle" x-text="current.subtitle"></p>
        <div class="mt-4 flex flex-wrap items-center gap-2 text-sm">
          <span x-show="current.duration" class="rounded-full bg-white/15 px-3 py-1" x-text="'🗓 ' + current.duration"></span>
          <span x-show="current.targetAudience" class="rounded-full bg-white/15 px-3 py-1" x-text="'👨‍👩‍👧 ' + current.targetAudience"></span>
          <a x-show="tripUrl" :href="tripUrl" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-1.5 rounded-full bg-amber-400 px-4 py-1.5 font-semibold text-emerald-950 shadow hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-white">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.4-2.7A1 1 0 013 16.4V5.6a1 1 0 011.4-.9L9 7m0 13l6-3m-6 3V7m6 10l4.6 2.3a1 1 0 001.4-.9V7.6a1 1 0 00-.6-.9L15 4m0 13V4m0 0L9 7"/></svg>
            Celá trasa v Mapách
          </a>
          <button type="button" x-show="hasGuide" @click="openGuide()"
                  class="inline-flex items-center gap-1.5 rounded-full bg-white/15 px-4 py-1.5 font-semibold text-white hover:bg-white/25 focus:outline-none focus:ring-2 focus:ring-amber-300">
            {{template "insider-icon"}}
            Miestny sprievodca
          </button>
        </div>
      </div>
    </template>
  </div>
</header>
{{end}}
