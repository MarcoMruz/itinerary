<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#064e3b">
  <title>Rodinné itineráre</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script type="module" src="/static/bootstrap.mjs"></script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="min-h-screen bg-stone-50 text-stone-800 antialiased">
<script id="boot" type="application/json">{{.}}</script>
<div x-data="itineraryApp()" x-cloak class="flex min-h-screen flex-col">
  {{template "header" .}}
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6">
    <div x-show="notice" class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" role="status" x-text="notice"></div>
    <div x-show="error" class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" x-text="error"></div>
    <div x-show="!current && !error" class="rounded-2xl border border-dashed border-stone-300 p-10 text-center text-stone-500">
      Zatiaľ žiadne itineráre. Pridajte ich cez <code class="text-emerald-700">POST /api/v1/itineraries</code> alebo MCP nástroj <code class="text-emerald-700">add_itinerary</code>,
      alebo cez <button type="button" @click="openIO()" class="font-semibold text-emerald-700 hover:underline">Import / Export</button> so šablónou pre AI asistenta.
    </div>
    <template x-if="current">
      <div class="grid gap-6 transition-opacity duration-200 lg:grid-cols-3" :class="loading && 'opacity-50'">
        <section class="lg:col-span-2" aria-label="Program">
          {{template "day-route" .}}
          {{template "timeline" .}}
        </section>
        {{template "checklist" .}}
      </div>
    </template>
  </main>
  {{template "navigation" .}}
  {{template "drawer" .}}
  {{template "sharing" .}}
  {{template "import-export" .}}
  {{template "footer" .}}
</div>
</body>
</html>
