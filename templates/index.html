<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#064e3b">
  <title>Rodinné itineráre</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="min-h-screen bg-stone-50 text-stone-800 antialiased">
<script id="boot" type="application/json">{{.}}</script>

<div x-data="itineraryApp()" x-cloak class="flex min-h-screen flex-col">

  <!-- Header -->
  <header class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-emerald-600 text-white shadow-lg">
    <div class="mx-auto max-w-6xl px-4 pb-8 pt-5 sm:px-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2 text-sm font-semibold uppercase tracking-wider text-emerald-100">
          <svg class="h-5 w-5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 20l6-16 4 10 3-5 5 11H3z"/></svg>
          Rodinné itineráre
        </div>
        <label class="relative w-full sm:w-80" x-show="list.length">
          <span class="sr-only">Vybrať itinerár</span>
          <select x-model="selectedId" @change="select(selectedId)"
                  class="w-full appearance-none rounded-xl border border-white/20 bg-white/10 py-2.5 pl-4 pr-10 text-sm font-medium text-white backdrop-blur focus:outline-none focus:ring-2 focus:ring-amber-300">
            <template x-for="i in list" :key="i.id">
              <option class="text-stone-800" :value="i.id" x-text="i.title" :selected="i.id === selectedId"></option>
            </template>
          </select>
          <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-emerald-100" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5.3 7.3a1 1 0 011.4 0L10 10.6l3.3-3.3a1 1 0 111.4 1.4l-4 4a1 1 0 01-1.4 0l-4-4a1 1 0 010-1.4z"/></svg>
        </label>
      </div>

      <template x-if="current">
        <div class="mt-6 transition-opacity duration-200" :class="loading && 'opacity-50'">
          <h1 class="text-2xl font-bold leading-tight sm:text-4xl" x-text="current.title"></h1>
          <p class="mt-2 text-emerald-100 sm:text-lg" x-show="current.subtitle" x-text="current.subtitle"></p>
          <div class="mt-4 flex flex-wrap items-center gap-2 text-sm">
            <span x-show="current.duration" class="rounded-full bg-white/15 px-3 py-1" x-text="'🗓 ' + current.duration"></span>
            <span x-show="current.targetAudience" class="rounded-full bg-white/15 px-3 py-1" x-text="'👨‍👩‍👧 ' + current.targetAudience"></span>
            <a x-show="tripUrl" :href="tripUrl" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-1.5 rounded-full bg-amber-400 px-4 py-1.5 font-semibold text-emerald-950 shadow hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-white">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.4-2.7A1 1 0 013 16.4V5.6a1 1 0 011.4-.9L9 7m0 13l6-3m-6 3V7m6 10l4.6 2.3a1 1 0 001.4-.9V7.6a1 1 0 00-.6-.9L15 4m0 13V4m0 0L9 7"/></svg>
              Celá trasa v Mapách
            </a>
          </div>
        </div>
      </template>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6">
    <div x-show="error" class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" x-text="error"></div>

    <div x-show="!current && !error" class="rounded-2xl border border-dashed border-stone-300 p-10 text-center text-stone-500">
      Zatiaľ žiadne itineráre. Pridajte ich cez <code class="text-emerald-700">POST /api/v1/itineraries</code> alebo MCP nástroj <code class="text-emerald-700">add_itinerary</code>.
    </div>

    <template x-if="current">
      <div class="grid gap-6 transition-opacity duration-200 lg:grid-cols-3" :class="loading && 'opacity-50'">

        <!-- Days & timeline -->
        <section class="lg:col-span-2" aria-label="Program">
          <nav class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-2 sm:mx-0 sm:px-0" role="tablist">
            <template x-for="(d, i) in current.days" :key="i">
              <button type="button" role="tab" :aria-selected="i === dayIndex" @click="dayIndex = i"
                      class="shrink-0 rounded-xl px-4 py-2 text-sm font-semibold transition focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      :class="i === dayIndex ? 'bg-emerald-700 text-white shadow' : 'bg-white text-stone-600 ring-1 ring-stone-200 hover:bg-emerald-50 hover:text-emerald-800'">
                <span x-text="d.label"></span>
                <span class="ml-1 text-xs opacity-70" x-text="'(' + d.activities.length + ')'"></span>
              </button>
            </template>
          </nav>

          <div class="mt-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 sm:p-5" x-show="day">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h2 class="flex items-center gap-2 font-bold text-stone-900">
                <svg class="h-5 w-5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.4-2.7A1 1 0 013 16.4V5.6a1 1 0 011.4-.9L9 7m0 13l6-3m-6 3V7m6 10l4.6 2.3a1 1 0 001.4-.9V7.6a1 1 0 00-.6-.9L15 4m0 13V4m0 0L9 7"/></svg>
                <span x-text="'Trasa dňa · ' + (day ? day.label : '')"></span>
              </h2>
              <button type="button" x-show="dayRoute.stops.length" @click="openNav('Trasa dňa · ' + day.label, dayRoute.stops, routeStart)"
                      class="inline-flex items-center gap-1.5 rounded-xl bg-amber-400 px-4 py-2 text-sm font-semibold text-emerald-950 shadow-sm hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                Otvoriť trasu v Mapách ↗
              </button>
            </div>
            <label class="mt-3 block">
              <span class="text-xs font-semibold uppercase tracking-wide text-stone-500">Štart (voliteľný)</span>
              <input type="text" :value="start" @input="start = $event.target.value; saveStart()" @change="routeStart = start.trim()" autocomplete="off"
                     placeholder="napr. hotel, v ktorom ste ubytovaní"
                     class="mt-1 w-full rounded-xl border border-stone-200 bg-stone-50 px-3 py-2 text-sm focus:border-emerald-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-200">
            </label>
            <p class="mt-1 text-xs text-stone-500" x-show="startMatch !== null"
               x-text="startMatch ? 'Na mape: ' + startMatch : 'Štart sa na mape nenašiel, vzdialenosť od neho sa nezobrazí. Skúste presnejší názov alebo adresu.'"></p>
            <p class="mt-1 text-xs text-stone-400" x-show="!start.trim()">Bez štartu začne trasa vo vašej aktuálnej polohe. Platí pre všetky dni tohto itinerára.</p>
            <ol class="mt-3 flex flex-wrap items-center gap-x-1.5 gap-y-2 text-sm" x-show="dayRoute.stops.length">
              <li x-show="routeStart" class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 py-1 pl-1 pr-3 ring-1 ring-amber-200">
                <span class="flex h-5 w-5 items-center justify-center rounded-full bg-amber-400 text-[11px] font-bold text-emerald-950">S</span>
                <span x-text="routeStart"></span>
              </li>
              <template x-for="(s, k) in dayRoute.stops" :key="k">
                <li class="inline-flex items-center gap-1.5">
                  <span class="text-stone-300" x-show="k > 0 || routeStart" aria-hidden="true">→</span>
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 py-1 pl-1 pr-3 ring-1 ring-emerald-200">
                    <span class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-700 text-[11px] font-bold text-white" x-text="k + 1"></span>
                    <span x-text="s"></span>
                  </span>
                </li>
              </template>
            </ol>
            <p class="mt-2 text-sm text-stone-500" x-show="legTotal" x-text="'Spolu autom: ' + fmtLeg(legTotal)"></p>
            <p class="mt-3 text-sm text-stone-500" x-show="!dayRoute.stops.length">Tento deň nemá žiadne body na mape.</p>
          </div>

          <ol class="relative mt-4 space-y-4 border-l-2 border-emerald-200 pl-6 sm:pl-8" x-show="day">
            <template x-for="(a, j) in (day ? day.activities : [])" :key="dayIndex + '-' + j">
              <li class="relative">
                <p x-show="legBefore(j)" class="mb-2 flex items-center gap-1.5 text-xs font-medium text-stone-500">
                  <svg class="h-4 w-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 16h14M6.5 16l1.6-5.2A2 2 0 0110 9.4h4a2 2 0 011.9 1.4L17.5 16M5 16v3h2v-3m10 0v3h2v-3"/></svg>
                  <span x-text="fmtLeg(legBefore(j))"></span>
                </p>
                <span x-show="dayRoute.nums[j]" :class="legBefore(j) ? 'top-10' : 'top-4'" class="absolute -left-[37px] flex h-6 w-6 items-center justify-center rounded-full bg-emerald-700 text-xs font-bold text-white ring-4 ring-stone-50 sm:-left-[45px]" x-text="dayRoute.nums[j]"></span>
                <span x-show="!dayRoute.nums[j]" class="absolute -left-[33px] top-5 h-4 w-4 rounded-full border-4 border-stone-50 bg-emerald-300 sm:-left-[41px]" aria-hidden="true"></span>
                <article class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 transition hover:shadow-md sm:p-5">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="inline-flex items-center gap-1 rounded-lg bg-emerald-50 px-2.5 py-1 font-mono text-xs font-semibold text-emerald-800">
                      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/></svg>
                      <span x-text="a.time"></span>
                    </span>
                    <span x-show="a.badge" class="rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-semibold text-amber-800 ring-1 ring-amber-200" x-text="a.badge"></span>
                  </div>
                  <h3 class="mt-2 text-lg font-semibold text-stone-900" x-text="a.title"></h3>
                  <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
                    <p x-show="a.location" class="flex items-center gap-1 text-sm text-stone-500">
                      <svg class="h-4 w-4 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                      <span x-text="a.location"></span>
                    </p>
                    <button type="button" x-show="a.place" @click="openNav(a.title, [a.place], '')"
                            class="inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-semibold text-emerald-700 ring-1 ring-emerald-200 hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                      Navigovať ↗
                    </button>
                    <a x-show="!a.place && a.mapsUrl" :href="a.mapsUrl" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-semibold text-emerald-700 ring-1 ring-emerald-200 hover:bg-emerald-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                      Navigovať ↗
                    </a>
                  </div>
                </article>
              </li>
            </template>
          </ol>
        </section>

        <!-- Checklist -->
        <aside class="lg:sticky lg:top-6 lg:self-start" aria-label="Checklist">
          <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-stone-200">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-bold text-stone-900">Checklist</h2>
              <span class="text-sm font-semibold text-emerald-700" x-text="progress.done + ' / ' + progress.total"></span>
            </div>
            <div class="mt-3 h-2 overflow-hidden rounded-full bg-stone-100">
              <div class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-amber-400 transition-all duration-300" :style="'width:' + progress.pct + '%'"></div>
            </div>
            <ul x-show="!editingChecklist" class="mt-4 space-y-1">
              <template x-for="(item, index) in current.checklist" :key="index">
                <li>
                  <label class="flex cursor-pointer items-start gap-3 rounded-lg p-2 hover:bg-stone-50">
                    <input type="checkbox" class="mt-0.5 h-5 w-5 shrink-0 rounded border-stone-300 accent-emerald-600"
                           :checked="checked.includes(item)" @change="toggle(item)">
                    <span class="text-sm" :class="checked.includes(item) && 'text-stone-400 line-through'" x-text="item"></span>
                  </label>
                </li>
              </template>
            </ul>
            <p x-show="!current.checklist.length" class="text-sm text-stone-500">Bez položiek.</p>
            <button type="button" x-show="canEdit && !editingChecklist" @click="beginChecklistEdit()" class="mt-4 rounded-lg px-3 py-2 text-sm font-semibold text-emerald-700 ring-1 ring-emerald-200">Upraviť zoznam</button>
            <button type="button" x-show="canEdit && !editingChecklist" @click="shareChecklist()" :disabled="sharingChecklist" class="mt-4 rounded-lg px-3 py-2 text-sm font-semibold text-emerald-700 ring-1 ring-emerald-200 disabled:opacity-50" x-text="sharingChecklist ? 'Pripravuje sa…' : 'Zdieľať zoznam'"></button>
            <div x-show="shareUrl" class="mt-3 space-y-2">
              <p class="text-xs text-stone-600">Každý s odkazom môže upravovať zoznam.</p>
              <label class="block text-xs text-stone-600">Odkaz na úpravu
                <input type="text" readonly :value="shareUrl" @focus="$el.select()" @click="$el.select()" class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm">
              </label>
            </div>
            <p role="status" aria-live="polite" class="mt-2 text-sm text-stone-600" x-text="shareMessage"></p>
            <form x-show="editingChecklist" @submit.prevent="saveChecklist()" class="mt-4 space-y-3">
              <fieldset :disabled="savingChecklist" class="space-y-3">
                <template x-for="(entry, index) in checklistDraft" :key="entry.id">
                  <div class="flex items-start gap-2">
                    <label class="min-w-0 flex-1">
                      <span class="sr-only" x-text="'Položka ' + (index + 1)"></span>
                      <textarea :value="entry.text" @input="changeChecklistItem(entry.id, $event.target.value)" required maxlength="500" rows="2" class="w-full rounded-lg border border-stone-300 p-2 text-sm focus:ring-2 focus:ring-emerald-500"></textarea>
                    </label>
                    <button type="button" @click="checklistDraft = checklistDraft.filter(e => e.id !== entry.id)" :aria-label="'Odstrániť položku ' + (index + 1)" class="rounded-lg py-2 text-xs text-red-700">Odstrániť</button>
                  </div>
                </template>
                <button type="button" @click="addChecklistItem()" :disabled="checklistDraft.length >= 200" class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-700 ring-1 ring-emerald-200 disabled:opacity-50">Pridať položku</button>
                <div class="flex flex-wrap gap-2">
                  <button type="submit" class="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white" x-text="savingChecklist ? 'Ukladá sa…' : 'Uložiť zmeny'"></button>
                  <button type="button" @click="editingChecklist = false; checklistMessage = ''" class="rounded-lg px-3 py-2 text-sm text-stone-600">Zrušiť</button>
                </div>
              </fieldset>
            </form>
            <p role="status" aria-live="polite" class="mt-3 text-sm" :class="checklistFailed ? 'text-red-700' : 'text-emerald-700'" x-text="checklistMessage"></p>
            <button type="button" x-show="checked.length" @click="checked = []; save()"
                    class="mt-3 text-xs font-semibold text-stone-400 hover:text-red-600">Zrušiť všetky označenia</button>
          </div>
        </aside>
      </div>
    </template>
  </main>

  <!-- Navigation app picker: bottom sheet on phones, centered modal on larger screens -->
  <dialog x-ref="nav" @click="$event.target === $el && $el.close()" aria-labelledby="nav-title"
          class="m-0 mt-auto w-full max-w-none rounded-t-3xl bg-white p-0 text-stone-800 shadow-2xl backdrop:bg-stone-900/50 sm:m-auto sm:max-w-md sm:rounded-3xl">
    <div class="p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))] sm:p-6">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-emerald-700">Otvoriť v aplikácii</p>
          <h2 id="nav-title" class="mt-0.5 text-lg font-bold text-stone-900" x-text="nav.title"></h2>
        </div>
        <button type="button" @click="$refs.nav.close()" aria-label="Zavrieť"
                class="-mr-2 -mt-1 rounded-full p-2 text-stone-400 hover:bg-stone-100 hover:text-stone-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="mt-2 text-sm text-stone-500" x-text="[nav.origin || 'Aktuálna poloha'].concat(nav.stops).join(' → ')"></p>
      <ul class="mt-4 space-y-2">
        <template x-for="app in navApps" :key="app.id">
          <li class="overflow-hidden rounded-2xl ring-1 transition"
              :class="app.id === lastApp ? 'bg-emerald-50 ring-2 ring-emerald-500' : 'ring-stone-200 hover:bg-stone-50'">
            <a :href="app.url" target="_blank" rel="noopener noreferrer" @click="pick(app.id)"
               class="flex items-center gap-3 p-3 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-emerald-500">
              <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-lg font-bold text-white" :class="app.color" x-text="app.letter" aria-hidden="true"></span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-2">
                  <span class="font-semibold text-stone-900" x-text="app.name"></span>
                  <span x-show="app.id === lastApp" class="rounded-full bg-emerald-600 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white">naposledy</span>
                </span>
                <span class="block text-xs text-stone-500" x-text="app.note"></span>
              </span>
              <span class="text-stone-400" aria-hidden="true">↗</span>
            </a>
            <div x-show="app.more.length" class="flex flex-wrap items-center gap-1.5 px-3 pb-3 pl-[68px] text-xs">
              <span class="text-stone-400">ďalej:</span>
              <template x-for="m in app.more" :key="m.url">
                <a :href="m.url" target="_blank" rel="noopener noreferrer" @click="pick(app.id)" x-text="m.label"
                   class="rounded-full bg-white px-2.5 py-1 font-semibold text-sky-700 ring-1 ring-sky-200 hover:bg-sky-50"></a>
              </template>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </dialog>

  <footer class="border-t border-stone-200 py-4 text-center text-xs text-stone-400">
    Agent ready: <a class="text-emerald-700 hover:underline" href="/api/v1/openapi.json">OpenAPI</a> ·
    <a class="text-emerald-700 hover:underline" href="/api/v1/itineraries">REST API</a> ·
    MCP <code>POST /mcp</code>
  </footer>
</div>

<script>
// Deep links per navigation app. Spaces are sent as %20 (what Apple and Waze
// document) rather than URLSearchParams' '+'.
function qs(pairs) {
  return pairs.map(function (kv) { return encodeURIComponent(kv[0]) + '=' + encodeURIComponent(kv[1]); }).join('&');
}

var mapLinks = {
  // https://developers.google.com/maps/documentation/urls/get-started#directions-action
  google: function (stops, origin) {
    var p = [['api', '1'], ['travelmode', 'driving']];
    if (origin) p.push(['origin', origin]);
    p.push(['destination', stops[stops.length - 1]]);
    if (stops.length > 1) p.push(['waypoints', stops.slice(0, -1).join('|')]);
    return 'https://www.google.com/maps/dir/?' + qs(p);
  },
  // Unified Maps URLs (iOS 18.4+, macOS 15.4+): repeated waypoint params for multistop.
  apple: function (stops, origin) {
    var p = [];
    if (origin) p.push(['source', origin]);
    stops.slice(0, -1).forEach(function (w) { p.push(['waypoint', w]); });
    p.push(['destination', stops[stops.length - 1]], ['mode', 'driving']);
    return 'https://maps.apple.com/directions?' + qs(p);
  },
  // https://developers.google.com/waze/deeplinks — one destination, always from the current location.
  waze: function (place) {
    return 'https://waze.com/ul?' + qs([['q', place], ['navigate', 'yes']]);
  }
};

function fmtDistance(m) {
  if (m < 1000) return Math.round(m) + ' m';
  return (m < 10000 ? (m / 1000).toFixed(1).replace('.', ',') : Math.round(m / 1000)) + ' km';
}

function fmtDuration(s) {
  var min = Math.max(1, Math.round(s / 60));
  return min < 60 ? min + ' min' : Math.floor(min / 60) + ' h ' + String(min % 60).padStart(2, '0') + ' min';
}

function fmtLeg(leg) {
  return leg ? fmtDistance(leg.meters) + ' · ' + fmtDuration(leg.seconds) : '';
}

function stopCount(n) {
  return n + (n === 1 ? ' zastávka' : n < 5 ? ' zastávky' : ' zastávok');
}

function itineraryApp() {
  var boot = JSON.parse(document.getElementById('boot').textContent) || {};
  var cache = new Map();
  var legsInFlight = new Set();
  if (boot.active) cache.set(boot.active.id, boot.active);

  return {
    list: boot.list || [],
    current: boot.active || null,
    selectedId: boot.active ? boot.active.id : '',
    dayIndex: 0,
    checked: [],
    canEdit: false,
    sharingChecklist: false,
    shareUrl: '',
    shareMessage: '',
    editingChecklist: false,
    savingChecklist: false,
    checklistDraft: [],
    checklistMessage: '',
    checklistFailed: false,
    draftSequence: 0,
    start: '',
    nav: { title: '', stops: [], origin: '' },
    lastApp: (function () { try { return localStorage.getItem('nav_app') || ''; } catch (e) { return ''; } })(),
    loading: false,
    error: '',
    routeStart: '', // start as last committed (blur/Enter); distances are measured from it, not from every keystroke
    legsByKey: {}, // legsKey → day legs answer { legs, places, complete }

    init: function () {
      var self = this;
      this.loadChecked();
      this.loadStart();
      this.openFromHash();
      this.checkChecklistAccess();
      this.$watch('legsKey', function () { self.loadLegs(0); });
      this.loadLegs(0);
      window.addEventListener('hashchange', function () { self.openFromHash(); });
      window.addEventListener('beforeunload', function (event) {
        if (self.editingChecklist) { event.preventDefault(); event.returnValue = ''; }
      });
      // Pick up itineraries added by agents while the tab was in the background.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') self.refreshList();
      });
    },

    get day() { return this.current ? this.current.days[this.dayIndex] : null; },

    get progress() {
      var items = this.current ? this.current.checklist : [];
      var self = this;
      var done = items.filter(function (c) { return self.checked.indexOf(c) !== -1; }).length;
      return { done: done, total: items.length, pct: items.length ? Math.round(done * 100 / items.length) : 0 };
    },

    // Route stops of one day: activities with a place, consecutive duplicates merged
    // (same rule as Day.RouteStops on the server). nums[j] is the stop number of
    // activity j (0 = not a stop); first[j] marks the activity that opens its stop.
    get dayRoute() {
      var stops = [], nums = [], first = [];
      (this.day ? this.day.activities : []).forEach(function (a) {
        var isNew = !!a.place && a.place !== stops[stops.length - 1];
        if (isNew) stops.push(a.place);
        nums.push(a.place ? stops.length : 0);
        first.push(isNew);
      });
      return { stops: stops, nums: nums, first: first };
    },

    get legsKey() {
      return this.current ? JSON.stringify([this.current.id, this.dayIndex, this.routeStart]) : '';
    },

    // legs[i] runs from point i to i+1 of [routeStart?, ...dayRoute.stops].
    get legs() {
      var entry = this.legsByKey[this.legsKey];
      return entry ? entry.legs : [];
    },

    // What the start matched on the map: null until known, '' when not found.
    get startMatch() {
      var entry = this.legsByKey[this.legsKey];
      if (!this.routeStart || !entry) return null;
      return entry.places[0] || (entry.complete ? '' : null);
    },

    // Leg arriving at activity j, shown only on the activity that opens a stop.
    legBefore: function (j) {
      var route = this.dayRoute, k = route.nums[j];
      if (!route.first[j]) return null;
      var leg = this.legs[this.routeStart ? k - 1 : k - 2];
      return leg && leg.meters > 0 ? leg : null;
    },

    get legTotal() {
      var legs = this.legs;
      if (!legs.length || legs.some(function (l) { return !l; })) return null;
      return legs.reduce(function (sum, l) { return { meters: sum.meters + l.meters, seconds: sum.seconds + l.seconds }; }, { meters: 0, seconds: 0 });
    },

    // Fetches the current day's legs. An incomplete answer (upstream hiccup,
    // deadline, 429) keeps what it has and retries a few times while still current.
    // A key stays in legsInFlight for its whole fetch/retry chain, so revisiting a day never starts a second chain.
    loadLegs: async function (attempt) {
      var key = this.legsKey, known = this.legsByKey[key], self = this;
      if (!key || this.dayRoute.stops.length + (this.routeStart ? 1 : 0) < 2 || (known && known.complete)) return;
      if (attempt === 0 && legsInFlight.has(key)) return;
      legsInFlight.add(key);
      var retryIn = 0;
      try {
        var url = '/api/v1/itineraries/' + encodeURIComponent(this.current.id) + '/days/' + this.dayIndex + '/legs' +
          (this.routeStart ? '?' + qs([['start', this.routeStart]]) : '');
        var res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (res.ok) {
          var body = await res.json();
          this.legsByKey = Object.assign({}, this.legsByKey, { [key]: { legs: body.legs || [], places: body.places || [], complete: !!body.complete } });
          if (!body.complete) retryIn = 3;
        } else if (res.status === 429 || res.status >= 500) {
          retryIn = Number(res.headers.get('Retry-After')) || 5;
        }
      } catch (e) {
        retryIn = 5; // offline: the route shows without distances until a retry succeeds
      }
      if (!retryIn || attempt >= 4) {
        legsInFlight.delete(key);
        return;
      }
      setTimeout(function () {
        if (self.legsKey === key) self.loadLegs(attempt + 1);
        else legsInFlight.delete(key); // revisiting the day starts a fresh chain
      }, retryIn * 1000);
    },

    get tripUrl() {
      if (!this.current) return '';
      if (this.current.mapsUrl) return this.current.mapsUrl;
      var stops = [];
      this.current.days.forEach(function (d) {
        d.activities.forEach(function (a) { if (a.place && a.place !== stops[stops.length - 1]) stops.push(a.place); });
      });
      return stops.length ? mapLinks.google(stops, this.routeStart) : '';
    },

    // Picker options. Google and Apple take the whole route; Waze links take a
    // single destination from the current location, so each stop gets its own link.
    get navApps() {
      var s = this.nav.stops, o = this.nav.origin;
      if (!s.length) return [];
      var whole = s.length > 1 ? 'Celá trasa · ' + stopCount(s.length) : 'Navigácia do cieľa';
      var waze = s.map(function (p, i) { return { label: (s.length > 1 ? (i + 1) + ' · ' : '') + p, url: mapLinks.waze(p) }; });
      return [
        { id: 'google', name: 'Google Maps', letter: 'G', color: 'bg-blue-600', note: whole, url: mapLinks.google(s, o), more: [] },
        { id: 'apple', name: 'Apple Maps', letter: 'A', color: 'bg-stone-900', note: whole, url: mapLinks.apple(s, o), more: [] },
        { id: 'waze', name: 'Waze', letter: 'W', color: 'bg-sky-400',
          note: '→ ' + waze[0].label + (s.length > 1 || o ? ' · Waze vie len 1 cieľ z aktuálnej polohy' : ''),
          url: waze[0].url, more: waze.slice(1) }
      ];
    },

    openNav: function (title, stops, origin) {
      this.nav = { title: title, stops: stops.slice(), origin: origin || '' };
      this.$refs.nav.showModal();
    },

    pick: function (app) {
      this.lastApp = app;
      try { localStorage.setItem('nav_app', app); } catch (e) { /* storage unavailable */ }
      this.$refs.nav.close();
    },

    openFromHash: function () {
      var parts = location.hash.slice(1).split('~');
      var id = decodeURIComponent(parts[0]);
      if (parts[1]) {
        history.replaceState(null, '', '#' + encodeURIComponent(id));
        this.activateOwner(id, parts[1]);
      }
      if (id && id !== this.selectedId) this.select(id);
    },

    activateOwner: async function (id, key) {
      try {
        var res = await fetch('/api/v1/itineraries/' + encodeURIComponent(id) + '/owner-session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key }) });
        if (!res.ok) throw new Error('Odkaz na úpravu je neplatný.');
        if (this.current && this.current.id === id) this.canEdit = true;
      } catch (e) { this.error = e.message || 'Nepodarilo sa povoliť úpravy. Otvorte odkaz znova.'; }
    },

    checkChecklistAccess: async function () {
      if (!this.current) return;
      var id = this.current.id;
      try {
        var res = await fetch('/api/v1/itineraries/' + encodeURIComponent(id) + '/checklist-access');
        if (!res.ok) return;
        var access = await res.json();
        if (this.current.id === id && access.canEdit) this.canEdit = true;
      } catch (e) { /* read-only until access can be verified */ }
    },

    beginChecklistEdit: function () {
      this.checklistDraft = this.current.checklist.map((text, index) => ({ id: index, text: text, original: text }));
      this.draftSequence = this.checklistDraft.length;
      this.checklistMessage = '';
      this.editingChecklist = true;
    },

    shareChecklist: async function () {
      if (this.sharingChecklist || !this.canEdit) return;
      var id = this.current.id;
      this.sharingChecklist = true;
      this.shareMessage = '';
      this.shareUrl = '';
      try {
        var res = await fetch('/api/v1/itineraries/' + encodeURIComponent(id) + '/checklist-share');
        if (!res.ok) throw new Error(res.status === 401 ? 'Otvorte súkromný odkaz na úpravu znova.' : 'Odkaz sa nepodarilo načítať. Skúste znova.');
        var body = await res.json();
        if (this.current.id !== id) return;
        this.shareUrl = body.url;
        try {
          await navigator.clipboard.writeText(body.url);
          if (this.current.id === id) this.shareMessage = 'Odkaz je skopírovaný.';
        } catch (e) {
          if (this.current.id === id) this.shareMessage = 'Skopírujte odkaz z poľa vyššie.';
        }
      } catch (e) {
        if (this.current.id === id) this.shareMessage = e.message || 'Odkaz sa nepodarilo načítať. Skúste znova.';
      } finally { this.sharingChecklist = false; }
    },

    changeChecklistItem: function (id, text) {
      this.checklistDraft = this.checklistDraft.map(entry => entry.id === id ? Object.assign({}, entry, { text: text }) : entry);
    },

    addChecklistItem: function () {
      this.checklistDraft = this.checklistDraft.concat({ id: this.draftSequence++, text: '', original: null });
    },

    saveChecklist: async function () {
      if (this.savingChecklist) return;
      var id = this.current.id;
      var draft = this.checklistDraft;
      this.checklistFailed = false;
      this.checklistMessage = '';
      if (draft.some(entry => !entry.text.trim())) {
        this.checklistFailed = true;
        this.checklistMessage = 'Vyplňte alebo odstráňte prázdne položky.';
        return;
      }
      this.savingChecklist = true;
      try {
        var res = await fetch('/api/v1/itineraries/' + encodeURIComponent(id) + '/checklist', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ checklist: draft.map(entry => entry.text.trim()) }) });
        if (!res.ok) throw new Error(res.status === 401 ? 'Otvorte súkromný odkaz na úpravu znova.' : 'Zmeny sa nepodarilo uložiť. Skúste znova.');
        var updated = await res.json();
        cache.set(id, updated);
        if (this.current.id !== id) return;
        this.checked = draft.filter(entry => entry.original !== null && this.checked.includes(entry.original)).map(entry => entry.text.trim());
        this.current = updated;
        this.save();
        this.editingChecklist = false;
        this.checklistMessage = 'Zmeny sú uložené.';
      } catch (e) {
        if (this.current.id === id) { this.checklistFailed = true; this.checklistMessage = e.message || 'Zmeny sa nepodarilo uložiť.'; }
      } finally { this.savingChecklist = false; }
    },

    select: async function (id) {
      if (!id) return;
      if (this.savingChecklist || (this.editingChecklist && !window.confirm('Zahodiť neuložené zmeny?'))) {
        this.selectedId = this.current.id;
        history.replaceState(null, '', '#' + encodeURIComponent(this.current.id));
        return;
      }
      this.canEdit = false;
      this.shareUrl = '';
      this.shareMessage = '';
      this.editingChecklist = false;
      this.checklistMessage = '';
      this.selectedId = id;
      this.error = '';
      if (decodeURIComponent(location.hash.slice(1)) !== id) history.replaceState(null, '', '#' + encodeURIComponent(id));

      var it = cache.get(id);
      if (!it) {
        this.loading = true;
        try {
          var res = await fetch('/api/v1/itineraries/' + encodeURIComponent(id), { headers: { Accept: 'application/json' } });
          if (!res.ok) throw new Error(res.status === 404 ? 'Itinerár neexistuje.' : 'Chyba servera (' + res.status + ').');
          it = await res.json();
          cache.set(id, it);
        } catch (e) {
          if (this.selectedId === id) { this.error = e.message || 'Nepodarilo sa načítať itinerár.'; this.loading = false; }
          return;
        }
        if (this.selectedId !== id) return; // a newer selection won the race
        this.loading = false;
      }
      this.current = it;
      this.checkChecklistAccess();
      this.dayIndex = 0;
      this.loadChecked();
      this.loadStart();
    },

    refreshList: async function () {
      try {
        var res = await fetch('/api/v1/itineraries', { headers: { Accept: 'application/json' } });
        if (res.ok) this.list = await res.json();
      } catch (e) { /* offline: keep current list */ }
    },

    storageKey: function () { return 'checklist_' + (this.current ? this.current.id : ''); },

    loadChecked: function () {
      try { this.checked = JSON.parse(localStorage.getItem(this.storageKey())) || []; }
      catch (e) { this.checked = []; }
    },

    // Start defaults to the itinerary's startLocation; a user edit (even clearing it) wins.
    loadStart: function () {
      var saved = null;
      try { saved = localStorage.getItem('start_' + (this.current ? this.current.id : '')); } catch (e) { /* storage unavailable */ }
      this.start = saved !== null ? saved : ((this.current && this.current.startLocation) || '');
      this.routeStart = this.start.trim();
    },

    saveStart: function () {
      try { localStorage.setItem('start_' + this.current.id, this.start); } catch (e) { /* storage unavailable */ }
    },

    save: function () {
      try { localStorage.setItem(this.storageKey(), JSON.stringify(this.checked)); } catch (e) { /* storage unavailable */ }
    },

    toggle: function (item) {
      var i = this.checked.indexOf(item);
      if (i === -1) this.checked.push(item); else this.checked.splice(i, 1);
      this.save();
    }
  };
}
</script>
</body>
</html>
